
<div class="w-full h-[100vh] flex flex-col justify-around">
    <div class="h-[1/3]">
        <h1 class="text-2xl font-bold text-center py-5">Connexion</h1>
    </div>
    <div class="w-full flex align-middle justify-center">
        <div
            class="w-full sm:w-1/2 md:w-1/3 px-3 py-5 rounded-[20px] "
            style="box-shadow: -20px -20px 50px rgba(197, 211, 191, 1), 20px 20px 50px rgba(130, 151, 125, 1);"
        >
            <form action="">
                <div class="flex flex-col">
                    <label
                        class="p-2"
                        for=""
                    >
                        Adresse email
                    </label>
                    <input
                        class="bg-ivoire border-2 border-solid border-vertFonce rounded-[5px] mb-5 p-1"
                        type="email"
                        name="email"
                        id=""
                    >

                    <label
                        class="p-2"
                        for=""
                    >
                        Mot de passe
                    </label>
                    <input
                        class="bg-ivoire border-2 border-solid border-vertFonce rounded-[5px] mb-5 p-1"
                        type="password"
                        name="password"
                        id=""
                    >
                    <div>
                        <input 
                            class="bg-ivoire border-2 border-solid border-vertFonce rounded-[5px] mr-2 mb-5 "
                            type="checkbox" name="remember-me" id=""
                        >
                        <label for="remember-me">Se souvenir de moi ?</label>
                    </div>

                    <!-- Btn success -->
                    <button
                        class="bg-sauge border-2 border-solid border-vertFonce rounded-[20px] text-vertFonce my-5py-1"
                        type="submit"
                    >
                        Se connecter
                    </button>
                </div>
            </form>
        </div>
    </div>
    <div class="text-center py-5">
        <p>
            Je n'ai pas de compte.
            <a class="text-bleuFonce" routerLink="/register">S'inscrire.</a>
        </p>
        
    </div>
</div>
