
<div class="w-full h-[100vh] flex flex-col justify-around">
    <div class="h-[1/3]">
        <h1 class="text-2xl font-bold text-center py-5">Connexion</h1>
    </div>
    <div class="w-full flex align-middle justify-center">
        <!-- <div class="w-1/3 px-3 py-5 shadow-[20px_20px_50px_rgba(197, 211, 191, 1)] rounded-[20px] "> -->
        <div
            class="w-1/3 px-3 py-5 rounded-[20px] "

        >
            <form action="">
                <div class="flex flex-col">
                    <label
                        class="p-2"
                        for=""

                    </label>
                    <input
                        class="bg-ivoire border-2 border-solid border-vertFonce rounded-[5px] mb-5"

                        name="email"
                        id=""

                    <label

                    </label>
                    <input

                    <!-- Btn success -->
                    <button
                        class="bg-sauge border-2 border-solid border-vertFonce rounded-[20px] text-vertFonce my-5"

            </form>
        </div>

    <div class="text-center py-5">
        <p>
            Je n'ai pas de compte.
