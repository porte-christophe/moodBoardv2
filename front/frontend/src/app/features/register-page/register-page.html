
<div class="w-full h-[100vh] flex flex-col justify-around">
    <div class="h-[1/3]">
        <h1 class="text-2xl font-bold text-center py-5">Inscription</h1>

            <form action="">

                    <label

                        Nom d'utilisateur
                    </label>
                    <input
                        class="bg-ivoire border-2 border-solid border-vertFonce rounded-[5px] mb-5 p-1"
                        type="text"
                        name="username"
                        id=""
                    >
                    <!-- Adresse email -->
                    <label
                        class="p-2"
                        for=""
                    >
                        Adresse email
                    </label>
                    <input
                        class="bg-ivoire border-2 border-solid border-vertFonce rounded-[5px] mb-5 p-1"

                        id=""

                    <!-- Mot de passe -->
                    <label
                        class="p-2"
                        for=""
                    >
                        Mot de passe
                    </label>
                    <input
                        class="bg-ivoire border-2 border-solid border-vertFonce rounded-[5px] mb-5 p-1"
                        type="password"
                        name="password"
                        id=""
                    >
                    <!-- Confirmation de mot de passe -->
                    <!-- <label
                        class="p-2"
                        for=""
                    >

                    </label>
                    <input
                        class="bg-ivoire border-2 border-solid border-vertFonce rounded-[5px] mb-5 p-1"
                        type="password"
                        name="password"
                        id=""
                    > -->

                    <!-- Btn "créer un compte" -->
                    <button
                        class="bg-sauge border-2 border-solid border-vertFonce rounded-[20px] text-vertFonce my-5 py-1"
                        type="submit"
                    >
                        Créer un compte
                    </button>
                </div>
            </form>
        </div>
    </div>
    <div class="text-center py-5">
        <p>
            Je possède déjà un compte.

    </div>
