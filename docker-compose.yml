# docker-compose.yml
services:
  front:
    build: ./front
    ports:
      - 4200:4200
    volumes:
      - ./front:/app
      - ./front/frontend/node_modules:/app/frontend/node_modules
    working_dir: /app/frontend
    # command: "npm install && npm start -- --host 0.0.0.0"
    command: "npm start -- --host 0.0.0.0"
    depends_on:
      - db

  back:
    build: ./back
    ports:
      - 3333:8000
    volumes:
      - ./back:/app
      - back_vendor:/app/vendor
    working_dir: /app
    command: "symfony serve --listen-ip=0.0.0.0 --no-tls"
    environment:
      - DATABASE_URL=mysql://user:password@db:3306/dbmood
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=dbmood
    depends_on:
      - db
  
  db:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=dbmood
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - 3306
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    ports:
      - 9988:80
    environment:
      - PMA_USER=user
      - PMA_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_HOST=db

volumes:
  db_data:
  back_vendor: